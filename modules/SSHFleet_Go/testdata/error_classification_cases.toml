# 错误分类回归语料（自旧工程 test/test_error_classification.py 程序化抽取，含变量引用解析）
# 字段语义：执行侧写下的事实（结果结构体的事实区子集 + 模式）；expected 为期望分类名；
# exit_code 省略即 nil（2026-09-29 起执行侧不再写结果退出码，exit_code 表达的是目的命令
# 的 CommandExitCode；传输模式的用例不再带 exit_code——传输没有命令）。
# banner = 认证阶段服务端提示原文（独立字段，判定时并入匹配文本）。

[[cases]]
name = "下载传输失败 permission denied"
error = "messages-20260816: 下载失败 - sshfleet.transfer.local_file_failed: permission denied"
output = ""
mode = "download"
success_files = 0
failed_files = 1
expected = "权限不足"

[[cases]]
name = "预处理失败（预检退出码进 Steps，结果退出码为空，按报错原文归类）"
error = "sshfleet.transfer.remote_missing: remote path not found: /var/log/x"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "远程路径不存在"

[[cases]]
name = "传输成功"
error = ""
output = "total_files=1, success_files=1, failed_files=0"
mode = "download"
success_files = 1
failed_files = 0
expected = "传输成功"

[[cases]]
name = "部分成功 3/5"
error = '''c.log: 下载失败 - sshfleet.transfer.local_file_failed: permission denied
sshfleet.transfer.finished: 3 of 5 files transferred'''
output = ""
mode = "download"
success_files = 3
failed_files = 2
expected = "部分成功"

[[cases]]
name = "仅密码被拒 → 身份验证失败"
error = "ssh: handshake failed: ssh: unable to authenticate, attempted methods [none password], no supported methods remain"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "身份验证失败"

[[cases]]
name = "认证被拒 Permission denied (publickey)"
error = "ssh: handshake failed: Permission denied (publickey)"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "身份验证失败"

[[cases]]
name = "execute exit_code=127"
exit_code = 127
error = "permission denied"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "执行失败(退出码127)"

[[cases]]
name = "execute exit_code=0"
exit_code = 0
error = ""
output = "ok"
mode = "execute"
success_files = 0
failed_files = 0
expected = "执行成功"

[[cases]]
name = "下载打开远程文件失败 → SFTP失败"
error = "sshfleet.transfer.local_file_failed: disk quota exceeded on /var/log"
output = ""
mode = "download"
success_files = 0
failed_files = 1
expected = "SFTP失败"

[[cases]]
name = "未知错误 → error 原文"
error = "disk quota exceeded on /var/log"
output = ""
mode = "download"
success_files = 0
failed_files = 1
expected = "disk quota exceeded on /var/log"

[[cases]]
name = "未知错误 output 原文"
error = ""
output = "command not found: ntpq"
mode = "execute"
success_files = 0
failed_files = 0
expected = "command not found: ntpq"

[[cases]]
name = "error/output 均为空 → 原因未知"
error = ""
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "原因未知"

[[cases]]
name = "密钥解析失败"
error = "sshfleet.connect.key_parse_failed: ssh: no key found"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "密钥解析失败"

[[cases]]
name = "无法建立会话"
error = "sshfleet.session.create_failed: ssh: rejected: administratively prohibited"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "无法建立会话"

[[cases]]
name = "已连上被中断"
error = "sshfleet.abort.canceled: interrupted after session established"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
canceled = true
expected = "任务已取消"

[[cases]]
name = "还没连上就被中断"
error = "sshfleet.abort.connect_canceled: interrupted while connecting"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
canceled = true
expected = "建连被取消"

[[cases]]
name = "资源耗尽 too many open files"
error = "sshfleet.connect.refused: dial tcp 1.2.3.4:22: connect: too many open files"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "资源耗尽"

[[cases]]
name = "本地文件不可读 → 本地文件错误"
error = "sshfleet.transfer.local_unreadable: a.txt: open a.txt: no such file or directory"
output = ""
mode = "upload"
success_files = 0
failed_files = 0
expected = "本地文件错误"

[[cases]]
name = "创建临时文件失败"
error = "sshfleet.transfer.tmp_failed: open /tmp/x: is a directory"
output = ""
mode = "upload"
success_files = 0
failed_files = 0
expected = "SFTP失败"

[[cases]]
name = "没有可下载的文件 → 远端没有文件"
error = "sshfleet.transfer.no_files: no files to download under /var/log/app"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "远端没有文件"

[[cases]]
name = "全部为符号链接 → 远端没有文件"
error = "sshfleet.transfer.no_files: all 3 entries are symlinks (filtered)"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "远端没有文件"

[[cases]]
name = "成功+跳过 → 传输成功"
error = ""
output = ""
mode = "download"
success_files = 8
failed_files = 0
expected = "传输成功"

[[cases]]
name = "仅公钥被拒 → 密钥不匹配"
error = "ssh: handshake failed: ssh: unable to authenticate, attempted methods [none publickey], no supported methods remain"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "密钥不匹配"

[[cases]]
name = "公钥+密码都被拒 → 身份验证失败（不再掩盖密码也被拒）"
error = "ssh: handshake failed: ssh: unable to authenticate, attempted methods [none publickey password], no supported methods remain"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
