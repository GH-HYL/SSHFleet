# 错误分类回归语料（自旧工程 test/test_error_classification.py 程序化抽取，含变量引用解析）
# 字段语义同 classify 的入参；expected 为期望分类名；exit_code 省略即 nil

[[cases]]
name = "下载传输失败 permission denied"
error = "messages-20260816: 下载失败 - 打开远程文件失败: permission denied"
output = ""
mode = "download"
success_files = 0
failed_files = 1
expected = "权限不足"

[[cases]]
name = "预处理失败 exit_code=1"
exit_code = 1
error = "远程路径不存在: /var/log/x"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "执行失败(退出码1)"

[[cases]]
name = "传输成功 exit_code=0"
exit_code = 0
error = ""
output = "total_files=1, success_files=1, failed_files=0"
mode = "download"
success_files = 1
failed_files = 0
expected = "传输成功"

[[cases]]
name = "部分成功 3/5"
error = "c.log: 下载失败 - 打开远程文件失败: permission denied"
output = ""
mode = "download"
success_files = 3
failed_files = 2
expected = "部分成功"

[[cases]]
name = "authentication failed"
error = "authentication failed"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "身份验证失败"

[[cases]]
name = "认证被拒 Permission denied (publickey)"
error = "ssh: handshake failed: Permission denied (publickey)"
output = ""
mode = "download"
success_files = 0
failed_files = 0
expected = "身份验证失败"

[[cases]]
name = "execute exit_code=127"
exit_code = 127
error = "permission denied"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "执行失败(退出码127)"

[[cases]]
name = "execute exit_code=0"
exit_code = 0
error = ""
output = "ok"
mode = "execute"
success_files = 0
failed_files = 0
expected = "执行成功"

[[cases]]
name = "下载打开远程文件失败 → SFTP失败"
