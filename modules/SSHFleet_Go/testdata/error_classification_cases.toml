# ---- 2026-09-16 新增：会话被拒与认证阶段被拒（判据见 config/keywords_error.conf 第二块）----
# 会话被拒时命令根本没执行，退出码来自拒绝方（nologin / sudo / sshd 会话）：命中判据即
# 按原因分类，退出码字段本身照旧保留（原 ADR-0004 口径；2026-09-29 起选组依据改为
# 「目的命令有没有给出退出码」，结论不变）。

[[cases]]
name = "密码过期（会话被拒，退出码 1）"
exit_code = 1
error = ""
output = "WARNING: Your password has expired.\nPassword change required but no TTY available."
mode = "execute"
success_files = 0
failed_files = 0
expected = "密码过期"

[[cases]]
name = "密码过期（认证阶段的服务端提示独立成字段）"
banner = "You are required to change your password immediately (administrator enforced)."
error = "sshfleet.connect.handshake_failed: ssh: handshake failed: EOF"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "密码过期"

[[cases]]
name = "账号过期（服务端提示）"
banner = "Your account has expired; please contact your system administrator."
error = "sshfleet.connect.handshake_failed: ssh: handshake failed: EOF"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "账号过期"

# 中文环境：这句提示由 PAM 发出，会按目标机语言翻译。
# 译文取自 RHEL 系 / openEuler 的 pam 包里 zh_CN 的 Linux-PAM.mo 原文（2026-10-18 查证）。
[[cases]]
name = "账号过期（服务端提示，中文环境）"
banner = "您的帐户已过期；请联系您的系统管理员。"
error = "sshfleet.connect.handshake_failed: ssh: handshake failed: EOF"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "账号过期"

# 批量改密走的是同一张判据表（改密分类被插在最前面），所以这条路径也要单独覆盖：
# 给已过期账号跑 --change-password，中文环境下的提示同样要认成「账号过期」。
[[cases]]
name = "账号过期（改密模式，中文环境）"
banner = "您的帐户已过期；请联系您的系统管理员。"
error = "sshfleet.connect.handshake_failed: ssh: handshake failed: EOF"
output = ""
mode = "passwd"
success_files = 0
failed_files = 0
expected = "账号过期"

[[cases]]
name = "账号过期（改密模式，英文环境）"
banner = "Your account has expired; please contact your system administrator."
error = "sshfleet.connect.handshake_failed: ssh: handshake failed: EOF"
output = ""
mode = "passwd"
success_files = 0
failed_files = 0
expected = "账号过期"

[[cases]]
name = "连接被断开（只有 EOF，服务端没说原因）"
error = "sshfleet.connect.handshake_failed: ssh: handshake failed: EOF"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
expected = "连接被断开"

[[cases]]
name = "登录 shell 为 nologin（中文文案）"
exit_code = 1
error = ""
output = "此帐户目前不可用。"
mode = "execute"
success_files = 0
failed_files = 0
expected = "登录被禁止"

[[cases]]
name = "仅允许 SFTP（ForceCommand internal-sftp）"
exit_code = 1
error = ""
output = "This service allows sftp connections only."
mode = "execute"
success_files = 0
failed_files = 0
expected = "仅允许 SFTP"

[[cases]]
name = "退出码非 0 且判据未命中 → 仍按退出码分类"
exit_code = 3
error = ""
output = "ls: cannot access '/nope': No such file or directory"
mode = "execute"
success_files = 0
failed_files = 0
expected = "执行失败(退出码3)"

# ---- 2026-10-20 新增：报文时代的形态覆盖 ----
# 此前语料里真正走结构字段的只有「部分成功」一条；「任务已取消」靠 error 文本命中关键词，
# 语料结构里根本没有「被取消」这个字段。这一批补上形态本身：执行侧在收尾时把结构事实
# 说成一句报文，判定层照旧查表——期望值仍是分类名，输入的来源换成了报文。

[[cases]]
name = "代填有未送出的条目"
error = "sshfleet.answer.missed: 2 answers not delivered"
output = "name= dept="
mode = "execute"
success_files = 0
failed_files = 0
session_begun = true
expected = "触发词未命中"

[[cases]]
name = "代填全部送出后仍超时"
error = "sshfleet.answer.exhausted_timeout: all answers sent but no output before timeout"
output = ""
mode = "execute"
success_files = 0
failed_files = 0
session_begun = true
timed_out = true
answers_exhausted = true
expected = "代填用尽后超时"

[[cases]]
name = "改密：一句都没喂出去就等到超时"
error = "sshfleet.passwd.no_signal: no password prompt seen before timeout"
output = ""
mode = "passwd"
success_files = 0
failed_files = 0
session_begun = true
timed_out = true
expected = "没等到提示"

[[cases]]
name = "改密：喂进去了等到点也没下文"
error = "sshfleet.passwd.no_reply: password fed but no reply before timeout"
output = ""
mode = "passwd"
success_files = 0
failed_files = 0
session_begun = true
timed_out = true
passwd_fed_any = true
expected = "远端无响应"

[[cases]]
name = "改密：远端问的话提示词表里没有"
error = "sshfleet.passwd.no_prompt: passwd exited without asking for input"
output = ""
mode = "passwd"
success_files = 0
failed_files = 0
session_begun = true
passwd_exit_code = 1
expected = "提示词没认出"

[[cases]]
name = "改密：远端还在重问、给出的答案已用完"
error = "sshfleet.passwd.give_up: no further prompts after answers used up"
output = ""
mode = "passwd"
success_files = 0
failed_files = 0
session_begun = true
passwd_early_close = true
expected = "改密未完成"

[[cases]]
name = "改密：这台机器的密码没过期"
error = "sshfleet.passwd.not_expired: no password-expiry prompt seen"
output = ""
mode = "passwd"
success_files = 0
failed_files = 0
session_begun = true
expected = "密码未过期"

[[cases]]
name = "代填没送完但命令退出 0（不许判成成功）"
error = "sshfleet.answer.missed: 1 answer not delivered"
output = ""
exit_code = 0
mode = "execute"
success_files = 0
failed_files = 0
expected = "触发词未命中"
