# ============================================================
# 危险命令检测规则（TOML 版；语义与正则自旧 YAML 一字未改，spec D11）
# ------------------------------------------------------------
# 定位：操作助手——命中就提示风险等级，提醒使用者注意
#
# 一条规则 = name + example + regex + risk_level（可选 enabled = false 即禁用）。
# 正则只要在命令里的任意位置匹配上，就按该条的级别提示（不限定开头）。
#
# risk_level：forbidden（最强提醒，提示后直接退出）/ high / medium / low
#
# 匹配对象是「归一化后的命令」：解析层会把 rm 的旗标拍平
# （-rf / -r -f / -R / --recursive 都变成 -r；-f / --force 变成 -f），
# 所以写正则时不用去管用户怎么写旗标。
# ============================================================


[[rules]]
name        = '递归删除根目录'
example     = 'rm -rf /'
regex       = '\brm -r.*\s/\*?\s'
risk_level  = 'forbidden'

[[rules]]
name        = '递归删除系统目录'
example     = 'rm -rf /etc'
regex       = '\brm -r.*\s/(?:etc|usr|var|lib|bin|sbin|boot|root)(?:/|\s)'
risk_level  = 'forbidden'

[[rules]]
name        = '格式化系统盘'
example     = 'mkfs /dev/sda'
regex       = '\bmkfs\s.*/dev/(?:sd|hd|vd)'
risk_level  = 'forbidden'

[[rules]]
name        = '销毁系统数据'
example     = 'dd if=/dev/zero of=/dev/sda'
regex       = '\bdd\s.*if=/dev/(?:zero|random).*of=/dev/(?:sd|hd|vd)'
risk_level  = 'forbidden'

[[rules]]
name        = '系统关机'
example     = 'shutdown -h now'
regex       = '\bshutdown\b'
risk_level  = 'forbidden'

[[rules]]
name        = '系统重启'
example     = 'reboot'
regex       = '\breboot\b'
risk_level  = 'forbidden'

[[rules]]
name        = '运行级别0'
example     = 'init 0'
regex       = '\b(?:init|telinit)\s+0\b'
risk_level  = 'forbidden'

[[rules]]
name        = '运行级别6'
example     = 'init 6'
regex       = '\b(?:init|telinit)\s+6\b'
risk_level  = 'forbidden'

[[rules]]
name        = '杀死所有进程'
example     = 'kill -9 -1'
regex       = '\bkill\s+-9\s+-1\b'
risk_level  = 'forbidden'

[[rules]]
name        = '屏蔽关键服务'
example     = 'systemctl mask sshd'
regex       = '\bsystemctl\s+mask\s+(?:sshd?|network|firewalld)\b'
risk_level  = 'forbidden'

[[rules]]
name        = '递归强制删除'
example     = 'rm -rf /opt/app/data'
regex       = '\brm -r -f\s'
risk_level  = 'high'

[[rules]]
name        = '使用 --no-preserve-root 危险旗标'
example     = 'rm --no-preserve-root -rf /'
regex       = '\brm\s.*--no-preserve-root\s'
risk_level  = 'high'

[[rules]]
name        = '强制删除配置或日志文件'
example     = 'rm -f app.conf'
regex       = '\brm -f.*\.(?:log|conf|cfg)\s'
risk_level  = 'high'

[[rules]]
name        = '格式化文件系统'
example     = 'mkfs.ext4 /dev/sdb1'
regex       = '\bmkfs\b'
risk_level  = 'high'

[[rules]]
name        = '数据覆盖操作'
example     = 'dd if=file.img of=/dev/sdb1'
regex       = '\bdd\s.*of=/dev/(?:sd|hd|vd)'
risk_level  = 'high'

[[rules]]
name        = '强制停止服务'
example     = 'systemctl stop nginx'
regex       = '\bsystemctl\s+stop\s+(?:mysql|nginx|apache)\b'
risk_level  = 'high'

[[rules]]
name        = '清空防火墙规则'
example     = 'iptables -F'
regex       = '\biptables\s+-F\b'
risk_level  = 'high'

[[rules]]
name        = '删除用户账户'
example     = 'userdel testuser'
regex       = '\buserdel\b'
risk_level  = 'high'

[[rules]]
name        = '强制软件包删除'
example     = 'rpm -e --nodeps package-name'
regex       = '\brpm\s+-e\s+--nodeps\b'
risk_level  = 'high'

[[rules]]
name        = '删除日志文件'
example     = 'rm -f /var/log/messages'
regex       = '\brm -f.*\s/var/log/'
risk_level  = 'medium'

[[rules]]
name        = '删除系统文件'
example     = 'rm -f /etc/hosts'
regex       = '\brm -f.*\s/etc/'
risk_level  = 'medium'

[[rules]]
name        = '递归删除'
example     = 'rm -r directory'
regex       = '\brm -r\s'
risk_level  = 'medium'

[[rules]]
name        = '强制删除'
example     = 'rm -f file.txt'
regex       = '\brm -f\s'
risk_level  = 'medium'

[[rules]]
name        = '权限修改'
example     = 'chmod 777 file.sh'
regex       = '\bchmod\s+[0-7]?[0-7][0-7]7\b'
risk_level  = 'medium'

[[rules]]
name        = '设置SUID权限'
example     = 'chmod u+s /usr/bin/script'
regex       = '\bchmod\s+u\+s\b'
risk_level  = 'medium'

[[rules]]
name        = '设置SGID权限'
example     = 'chmod g+s /usr/bin/script'
regex       = '\bchmod\s+g\+s\b'
risk_level  = 'medium'

[[rules]]
name        = '修改文件所有者'
example     = 'chown root:root /etc/passwd'
regex       = '\bchown\s+(?:root|:root)\b'
risk_level  = 'medium'

[[rules]]
name        = '禁用系统服务'
example     = 'systemctl disable service-name'
regex       = '\bsystemctl\s+disable\b'
risk_level  = 'medium'

[[rules]]
name        = '修改内核参数'
example     = 'sysctl -w kernel.parameter=value'
regex       = '\bsysctl\s+-w\b'
risk_level  = 'medium'

[[rules]]
name        = '锁定用户账户'
example     = 'passwd -l username'
regex       = '\bpasswd\s+-l\b'
risk_level  = 'medium'

[[rules]]
name        = '删除用户组'
example     = 'groupdel groupname'
regex       = '\bgroupdel\b'
risk_level  = 'medium'

[[rules]]
name        = '清空系统日志'
example     = 'truncate -s 0 /var/log/messages'
regex       = '\btruncate\s+-s\s+0\s+/var/log/'
risk_level  = 'medium'

[[rules]]
name        = '软件包更新'
example     = 'yum update'
regex       = '\byum\s+update\b'
risk_level  = 'low'

[[rules]]
name        = '软件包删除'
example     = 'yum remove package-name'
regex       = '\byum\s+remove\b'
risk_level  = 'low'

[[rules]]
name        = '强制安装软件包'
example     = 'rpm -i --force package.rpm'
regex       = '\brpm\s+-i\s+--force\b'
risk_level  = 'low'

[[rules]]
name        = '清空命令历史'
example     = 'history -c'
regex       = '\bhistory\s+-c\b'
risk_level  = 'low'

[[rules]]
name        = '运行级别切换'
example     = 'init 3'
regex       = '\b(?:init|telinit)\s+[1-5]\b'
risk_level  = 'low'

[[rules]]
name        = '普通服务重启'
example     = 'systemctl restart nginx'
regex       = '\bsystemctl\s+restart\s+\w+'
risk_level  = 'low'
