# -*- coding: utf-8 -*-
# SSHFleet 配置文件（TOML，5.0.0 起；存放于 ./config/SSHFleet.conf，基准为当前工作目录）

# 账号信息
[account]
port = 10022                 # 默认 SSH 端口（清单第 2 列留空时用）
user = "jx_zyc"              # 默认用户名（清单第 3 列留空时用）
password_security = 3        # 密码安全等级，数字越大越安全
                             #   1=明文：文件内容即密码原文
                             #   2=base64：文件内容为密码的 base64 编码
                             #   3=加密：文件内容为密文，需 --gen-key 配主密钥后转换
secret_dir = "~/.MyPW"       # 凭据目录：密码/私钥/私钥口令文件的相对路径都拼到这里（"" 即未配置）
password = "SSHFleet_pw"     # 默认密码文件路径（内容格式随 password_security 变化，用 --convert-password 转换；无则留空）
key = ""                     # 默认私钥文件路径（内容为 PEM 私钥原文）
key_passphrase = ""          # 默认私钥口令文件路径（内容格式同密码文件，随等级变化；无则留空）

# 执行参数
[execution]
mode = "sudo"           # 执行身份：direct=用登录用户身份执行，sudo=用 root 身份执行（默认 sudo）
timeout_connect = 10    # 连接超时（秒）
timeout_execute = 60    # 执行超时（秒），执行命令或脚本的超时
timeout_transfer = 300  # 传输超时（秒），上传或下载文件的超时

# 功能开关（缺省即 true）
[enable]
output_to_xlsx = true   # 终端输出同时导出 xlsx；false=仅输出到 txt
results_to_xlsx = true  # 结果固化到 xlsx 文件；false=不输出到本地文件

# 文件路径（关键字规则文件、日志与结果文件名）
[paths]
error_keywords = "./config/error_keywords.toml"          # 错误分类关键词 TOML 文件
dangerous_keywords = "./config/dangerous_keywords.toml"  # 危险命令规则 TOML 文件（平级正则，enabled = false 即禁用）
historys = "historys"       # 存放历史记录文件夹名称
tool = "SSHFleetTools.log"  # 工具日志文件名
exec = "SSHFleetExec.log"   # 执行日志文件名
asset = "assets"               # 历史记录中转存资产文件夹名称（清单 CSV、脚本会备份到这里）
output = "output.txt"          # 终端输出文件名（txt格式）
output_xlsx = "output.xlsx"    # 终端输出文件名（xlsx格式）
report = "report.txt"          # 统计报告文件名（txt格式）
results_xlsx = "results.xlsx"  # 结果固化文件名（xlsx格式）

# 上传文件参数
[upload.concurrency_thresholds]  # 单位"字节 B"，按文件大小决定并发策略
small_file = 2097152     # 2MB；小于此值全量并发
large_file = 20971520    # 20MB；大于此值串行上传
medium_concurrency = 10  # 介于两者之间时的并发数
