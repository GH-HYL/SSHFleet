# SSHFleet 配置文件。所有字段必须保留；缺字段或取值非法，启动即报错。

# ════════════════════════ 基础配置 ════════════════════════

# 账号
[account]
user     = "jx_zyc"                                     # 登录用户名
port     = 10022                                        # SSH 端口
password = "C:/Users/Administrator/.MyPW/SSHFleet_pw"   # 服务器密码

# 执行参数
[execution]
sudo             = true     # root 身份执行；false 用登录用户
timeout_connect  = 10       # 连接超时（秒）
timeout_execute  = 60       # 命令/脚本超时（秒）
timeout_transfer = 300      # 上传下载超时（秒）

# ════════════════════════ 凭据 ════════════════════════

# encrypt 决定 password/key_password 与清单第 4、6 列填明文还是文件路径
[credential]
encrypt      = true                             # 加密存放密码与口令
key          = ""                               # 统一私钥路径；留空用清单第 5 列
key_password = ""                               # 私钥口令
secret_dir   = "C:/Users/Administrator/.MyPW"   # 清单相对路径的拼接目录

# ════════════════════════ 进阶配置 ════════════════════════

# 输出开关
[enable]
output_to_xlsx     = true   # 终端输出同时导出 Excel
results_to_xlsx    = true   # 结果明细导出 Excel
show_category_tips = true   # 统计末尾显示失败分类提示

# 远端交互代填（-a）的匹配口径：两个开关同时管触发词与中止词
[interactive]
regex          = false   # 触发词按正则匹配；false 按子串包含
case_sensitive = false   # 匹配区分大小写

# 上传并发
[upload]
small_file      = 2097152    # 总大小小于此值（字节）：全部并行
large_file      = 20971520   # 总大小大于此值：串行
medium_parallel = 10         # 两者之间：并发数
