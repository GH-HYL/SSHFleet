# SSHFleet 配置文件。所有字段必须保留；缺字段或取值非法，启动即报错。

# ═════════════════════════════════════════════════════════
# ════════════════════════ 基础配置 ════════════════════════
# ═════════════════════════════════════════════════════════

# 账号配置
[account]
port     = 10022                                        # SSH 端口；-f 选项参数的内联清单或 csv 第 2 列 留空时，使用此统一私钥
user     = "jx_zyc"                                     # 登录用户名；-f 选项参数的内联清单或 csv 第 3 列 留空时，使用此统一私钥
password = "C:/Users/Administrator/.MyPW/SSHFleet_pw"   # 服务器密码；-f 选项参数的内联清单或 csv 第 4 列 留空时，使用此统一私钥（加密模式下必须填写绝对路径，明文模式下直接填写密码字符串）

# 参数配置
[execution]
sudo             = true     # root 身份执行（命令使用 sudo 执行）；false 用登录用户
timeout_connect  = 10       # SSH连接超时（秒）
timeout_execute  = 60       # 命令/脚本超时（秒）
timeout_transfer = 300      # 上传下载超时（秒）



# ═════════════════════════════════════════════════════════
# ════════════════════════ 进阶配置 ════════════════════════
# ═════════════════════════════════════════════════════════

# 凭据配置
[credential]
encrypt      = true                             # 加密模式，加密存放密码与口令；决定了凭据内容是明文密码还是加密文件路径，涉及 -f 选项参数的内联清单或 csv 第 4、6 列填明文还是文件路径
key          = ""                               # 统一私钥路径；-f 选项参数的内联清单或 csv 第 5 列 留空时，使用此统一私钥
key_password = ""                               # 私钥口令；-f 选项参数的内联清单或 csv 第 6 列 留空时，使用此统一私钥口令
secret_dir   = "C:/Users/Administrator/.MyPW"   # 加密凭据文件的相对路径拼接目录，必须是绝对路径且是目录（只用于加密等级下内联清单或 csv的第 4、6 列可填文件名，命令）

# 开关配置
[enable]
output_to_xlsx     = true   # 终端输出同时导出 Excel
results_to_xlsx    = true   # 结果明细导出 Excel
show_category_tips = true   # 终端输出统计末尾显示失败分类提示

# 交互配置 （仅在 -a 参数下生效，用于匹配触发词和代填值）
[interactive]
regex          = false   # 触发词按正则匹配；false 按子串包含
case_sensitive = false   # 匹配区分大小写

# 上传并发配置（用于上传文件建议提示）
[upload]
small_file      = 2097152    # 总文件大小小于此值（字节）：全部并行
large_file      = 20971520   # 总文件大小大于此值（字节）：串行
medium_parallel = 10         # 文件大小处于两者之间的并发数
