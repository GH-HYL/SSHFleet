# SSHFleet 配置文件。所有字段必须保留；缺字段或取值非法，启动即报错。

# ═════════════════════════════════════════════════════════
# ═══════════════════════ 基础配置 ════════════════════════
# ═════════════════════════════════════════════════════════

# 账号配置
[account]
port     = 10022                                        # SSH 端口；-f 选项参数的内联清单或 csv 第 2 列留空时，使用此统一端口
user     = "jx_zyc"                                     # 登录用户名；-f 选项参数的内联清单或 csv 第 3 列留空时，使用此统一用户名
password = "C:/Users/Administrator/.MyPW/SSHFleet_pw"   # 服务器密码；-f 选项参数的内联清单或 csv 第 4 列留空时，使用此统一密码（加密模式下必须填写本机绝对路径，明文模式下直接填写密码字符串）

# 参数配置
[execution]
sudo             = true     # 命令以 root 身份执行；需目标节点已配免密 sudo（NOPASSWD）；false 以登录用户执行
timeout_connect  = 10       # SSH连接超时（秒）
timeout_execute  = 60       # 命令/脚本超时（秒）
timeout_transfer = 300      # 上传下载超时（秒）



# ═════════════════════════════════════════════════════════
# ═══════════════════════ 进阶配置 ════════════════════════
# ═════════════════════════════════════════════════════════

# 凭据配置
[credential]
encrypt      = true                             # 加密存放密码与口令；决定内联清单或 csv 第 4、6 列填明文还是加密文件路径
key          = ""                               # 统一私钥路径；-f 选项参数的内联清单或 csv 第 5 列留空时，使用此统一私钥
key_password = ""                               # 私钥口令；-f 选项参数的内联清单或 csv 第 6 列留空时，使用此统一口令
secret_dir   = "C:/Users/Administrator/.MyPW"   # 凭据目录，写本机的绝对路径；清单里只写文件名时与它拼接

# 开关配置
[enable]
output_to_xlsx     = true   # 终端输出同时导出 Excel
results_to_xlsx    = true   # 结果明细导出 Excel
show_category_tips = true   # 终端输出统计末尾显示失败分类提示

# 交互配置（-a 代填与 --change-password 改密的匹配口径）
[interactive]
regex          = false   # 触发词按正则匹配；false 按子串包含
case_sensitive = false   # 匹配区分大小写

# 远端环境变量（命令行下发前在远端导入，一行一个；值里的 $ 由目标节点展开，要字面的 $ 写 \$；把某一行的值留空 = 关掉这一条）
[env]
LANG   = "en_US.UTF-8"   # 兜底的语言环境
LC_ALL = "en_US.UTF-8"   # 统一字符集与排序（优先级最高，覆盖其余 LC_*）
PATH   = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"   # 补一组标准目录（非交互会话的 PATH 常只剩 /usr/bin:/bin）
TERM   = "dumb"          # 统一成哑终端，抑制彩色与转义序列
# 想加别的环境变量，照上面一行一条往下加，例如 MY_VAR = "值"

# 解释器配置（只对 -c 命令模式与 -s 脚本模式生效）
[interpreter]
command = "bash"         # -c 用的解释器：写名字（bash）或绝对路径都行

# -s 用的：后缀 = 解释器，一行一种，可自行增删
[interpreter.script]
".sh" = "bash"
".py" = "python3"

# 上传并发配置（用于上传文件建议提示）
[upload]
small_file      = 2097152    # 总文件大小小于此值（字节）：全部并行
large_file      = 20971520   # 总文件大小大于此值（字节）：串行
medium_parallel = 10         # 总文件大小处于两者之间的并发数
