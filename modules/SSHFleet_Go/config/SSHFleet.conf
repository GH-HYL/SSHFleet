# SSHFleet 配置文件
# 存放于 ./config/SSHFleet.conf，基准是运行时的当前工作目录（也就是程序所在的那一层）。
#
# 所有字段都要写出来（值可以留空），缺字段或写了不认识的字段都会在启动时直接报错。

# ═══════════════════════════════════════════════════
#  基础配置 —— 上手只需要改这里
# ═══════════════════════════════════════════════════

# 账号信息
[account]
user     = "jx_zyc"                                     # 登录用户名
port     = 10022                                        # SSH 端口
password = "C:/Users/Administrator/.MyPW/SSHFleet_pw"   # 服务器密码

# ═══════════════════════════════════════════════════
#  进阶配置 —— 进阶才动；字段一个不能多、一个不能少
# ═══════════════════════════════════════════════════

# 凭据存放。这四行仍属于 [account] 表：TOML 一张表只能出现一次，只能紧跟
# 账号信息，所以插在基础配置中间——下面的执行参数就属基础配置。
encrypt    = true                             # 凭据是否加密存放：false=明文，true=加密（password/key_password 改成文件的绝对路径）
key        = ""                               # 统一私钥文件的绝对路径；留空=需要在清单第 5 列逐台写
key_password = ""                             # 私钥口令；加密时填口令文件的绝对路径，留空=私钥没有口令
secret_dir = "C:/Users/Administrator/.MyPW"   # 凭据目录：只对清单里的相对路径生效，留空则清单必须写绝对路径

# 执行参数（属于基础配置）
[execution]
sudo             = true                       # 改成 true 用 root 身份执行，false 用登录用户身份
timeout_connect  = 10                         # 连上服务器的最长等待（秒）
timeout_execute  = 60                         # 命令跑完的最长等待（秒）
timeout_transfer = 300                        # 文件传完的最长等待（秒）

# 功能开关
[enable]
output_to_xlsx     = true                     # 终端输出是否同时导出 Excel；false=只留文本
results_to_xlsx    = true                     # 结果明细是否导出 Excel；false=不产出这个文件
show_category_tips = true                     # 统计末尾是否显示「提示：」块（各分类可能对应哪些情况）；false=不显示

# 上传并发策略：按上传总大小决定同时传几个
[upload]
small_file      = 2097152                     # 上传总大小小于它（字节）= 全量并发
large_file      = 20971520                    # 上传总大小大于它（字节）= 串行上传
medium_parallel = 10                          # 介于两者之间时用的并发数
