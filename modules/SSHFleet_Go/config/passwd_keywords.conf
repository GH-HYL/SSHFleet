# ============================================================
# 批量改密规则（可自由修改）
# ------------------------------------------------------------
# 作用：`--change-password` 运行时，这个文件回答两件事——
#       1. 远端在问什么、这一问该填什么（下面的 [[step]]）
#       2. 没改成时算哪一类失败（下面的 [[category]]）
#
# 【值不在这里配】
#   当前密码 = 清单里那台机器自己的登录密码
#   新密码   = 命令行 --change-password 给的
#
# 【怎么改】
#   认不出的提问：把远端打印的那句话原样抄一段，补进对应那条的 keywords 里。
#                 最常见的三种提问（当前的密码 / 新的密码 / 重新输入）已经写好了。
#   认不出的失败：在 [[category]] 里加一条，keywords 写远端报错里出现过的几个字即可。
#   存盘后重新运行即可，不用改程序。
#
# 【两条要注意】
#   1. [[step]] 一条都不能少——少了工具就认不出远端的提问，改密只能干等到超时，
#      所以启动时就会拦下报错
#   2. 什么时候开始填也不在这里配：远端提示里出现「密码过期」那几个词，工具才动手；
#      没出现就当这台机器不需要改密
# ============================================================


# ===== 一、认提问：远端问这句，就填这个值 =====

# 一份提问一条；顺序即提问顺序。远端重问就再填一次，填满为止。
[[step]]
# 提示原文：从远端打印的提示里原样抄一段就够。提示语言跟着目标机走，中英文都留着
keywords = ['当前的密码', 'Current password', '(current) UNIX password']
# value 只能写两个之一：current = 清单里的登录密码，new = --change-password 的新密码
value    = 'current'
# 这句最多填几次
max      = 1

[[step]]
keywords = ['新的密码', 'New password']
value    = 'new'
# 新密码被目标机判太弱时它会重问，留几次余量
max      = 4

[[step]]
keywords = ['重新输入', 'Retype']
value    = 'new'
max      = 4


# ===== 二、认失败：没改成时算哪一类 =====

# 自上而下匹配，先命中的算数。keywords 写远端报错里出现过的几个字就行，不必整句抄；
# 中英文都留着——提示语言跟着目标机走。都不命中时，结果显示的就是报错原文本身。
#
# 顺序是按「先根因、后结论」排的：远端有时连说两句（先说为什么写不进去，再说密码没改），
# 让根因先认出来，才不会都归到「新密码不合规」上。

[[category]]
name = '写不进密码文件'
# 目标机写不进 /etc/shadow 时，报的往往都是这一句——磁盘满、根分区只读、账号被锁定
# 都可能，光看它分不出是哪一种，得去目标机上查
tip  = '到目标机上查 df -h 与 /etc/shadow 的属性'
keywords = [
    'Authentication token manipulation error',
    '认证令牌操作错误',
]

[[category]]
name = '密码文件被锁定'
# 另一个改密进程（人工操作、其它工具、定时任务）正占着 /etc/shadow
tip  = '错峰再跑，别让同一台机器上的改密撞在一起'
keywords = [
    'cannot lock',
    '无法锁定',
    'token lock busy',
    'try again later',
    '请稍后再试',
]

[[category]]
name = 'PAM 配置出错'
# 目标机改密那一段 PAM 配置有问题：模块缺失、路径写错、加载失败
tip  = '看目标机的 /etc/pam.d/，password 那几行里的模块是不是缺了或写错了'
keywords = [
    'pam_chauthtok',
    'pam_start',
    'Module is unknown',
    '模块未知',
]

[[category]]
name = 'SELinux 拦截'
tip  = '目标机开了 SELinux，且不允许改这个账号的密码'
keywords = [
    'SELinux',
]

[[category]]
name = '旧密码不对'
# 清单里写的那台机器的登录密码，目标机不认——密码被别人改过时会这样
tip  = '把清单里那台机器的密码更新成现在能用的'
keywords = [
    'Authentication failure',
    '验证失败',
]

[[category]]
name = '改密太频繁'
# 目标机要求两次改密之间隔够天数（/etc/shadow 第 4 列），现在还没到
tip  = '等够天数再改，或去目标机上调整这个间隔'
keywords = [
    'You must wait longer',
    '等待更长时间',
]

[[category]]
name = '账号不允许改密'
tip  = '账号被锁定或密码已失效，目标机不允许它自己改密码'
keywords = [
    'passwordless account',
    '没有密码的账户',
    'You may not view or modify',
    '不能查看或更改',
]

[[category]]
name = '改密没有权限'
# 改别人的密码时才可能撞上（那需要 root）
tip  = '登录账号只能改自己的密码'
keywords = [
    'Permission denied.',
    '没有权限。',
]

[[category]]
name = '新密码不合规'
# 目标机的密码规则拒了新密码：太短、太简单、与旧密码太像、在字典里，或两次输入不一致
tip  = '换一个复杂些、与旧密码不相似的新密码'
keywords = [
    'BAD PASSWORD',
    '密码未被更改',
    '密码未被改变',
    '密码未更改',
    '密码没有更改',
    '没有更改',
    'is unchanged',
    'password unchanged',
    '脆弱的密码',
    'weak password',
    '并不匹配',
    "don't match",
    'too short',
    'too similar',
    'dictionary',
    '太短',
    '太简单',
    '基于字典',
    '过于简单',
]

[[category]]
name = '改密未完成'
# 上面都没认出来时归这里——远端要么只反复重问却不说原因，要么收下密码后一直不吭声
tip  = '去目标机上看一眼：新密码是不是不符合它的规则，或它的提示措辞没写进上面的 [[step]]'
keywords = [
    '改密没有完成',
]

[[category]]
name = '密码未过期'
# 这台机器的密码没过期：工具没等到「密码过期」的信号就收场了，没动过它的密码
tip  = '本来就不用改——清单里只放要改的那几台最省事'
keywords = [
    '密码未过期，跳过改密',
]
