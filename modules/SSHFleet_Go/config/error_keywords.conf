# ============================================================
# 错误分类规则（可自由修改）
# ------------------------------------------------------------
# 这个文件决定：每个执行失败的节点，在结果里显示什么「分类」。
#
# 例：目标机的密码过期时，报错里会出现 "Password change required but no TTY available"，
#     命中下面第二组的关键词，分类就显示「密码过期」——而不是笼统的「执行失败(退出码1)」。
#
# 【怎么改】
#   调分类效果：在对应分类的 keywords 里增删关键词，存盘后重新运行即可，不用改程序。
#   加新分类  ：复制一组 [[categories]]，改名、关键词、tip，位置按上面第 2 条规则放。
#   停用分类  ：整组删掉即可（该分类从结果里消失，它会退回显示报错原文）。
#   加提示    ：每个分类都有一行 tip，写的是"这个分类可能包括哪些情况"：
#                 tip = '账号过期/被锁、禁止登录、并发限流、链路中断'
#               本次真出现了该分类、且 tip 有内容时，统计末尾会跟着显示这一句；
#               写空串 tip = '' 就不显示——还没想好的先留空，不影响使用。
#               （「执行失败(退出码N)」那条由工具按退出码自动给，不用在这里写）
#
#   一组是这样写的：
#     [[categories]]
#     name = '分类名'                        ← 结果显示的分类名，自己能看懂就行
#     tip = '可能包括哪些情况'                ← 统计末尾的提示，写空串 tip = '' 则不显示
#     keywords = [ '关键词1', '关键词2' ]     ← 至少要有一个
#
# 【匹配规则】
#   1. 不区分大小写；报错内容里出现这个关键词就算命中，不必整句一字不差
#   2. 从上往下试，先命中的分类胜出 → 具体的原因写在前面，笼统的写在后面
#   3. 中间会变化的部分用 * 代替，例：'ssh: command * failed'
#   4. 关键词越长越准。写得太短会把别的报错也认成它
#      （例：只写 'expired' 会把证书过期、登录会话过期一起认成密码过期）
#
# 【两组规则的区别：按"命令到底跑没跑"分】
#   第一组 [[categories]]            命令没能正常执行时用：连不上、超时、认证失败、磁盘满……
#   第二组 [[exit_code_categories]]  连上了、命令却被目标机拒绝执行时用（如密码过期）。
#                                    这里命中的分类会顶掉「执行失败(退出码N)」，退出码本身照旧保留。
#
# 【怎么确认改对了】
#   跑一次，看结果明细里的「分类」；不对就回来改这里。
# ============================================================


# ===== 第一组：命令没能正常执行 =====

[[categories]]
name = '网络不可达'
# 网络层面就到不了目标机
tip = '目标机没开机、IP 写错、不在同一网段、路由或防火墙把 ICMP 挡了'
keywords = [
    'no route to host',
    'network is unreachable',
    'host is unreachable',
]

[[categories]]
name = '握手超时'
# 连上了但握手谈不拢，超过了配置里的连接超时
tip = '目标机负载过高、sshd 在认证前被限流（MaxStartups）、链路质量差、中间设备限速'
keywords = [
    '握手超时',
]

[[categories]]
name = '密钥不匹配'
# 只在「没配密码、只用密钥、密钥被拒」时命中；配了密码的会落到下面的「身份验证失败」，
# 这样才不会把「密码也被拒」这个事实盖掉
tip = '目标机上没有这把公钥、authorized_keys 没加或加到了别的机器、私钥与目标机上的公钥不是一对'
keywords = [
    '[none publickey]',
]

[[categories]]
name = '密钥解析失败'
# 私钥本身有问题：格式不对、口令不对、文件内容不是私钥
tip = '私钥有口令但没给口令、格式不对（如 PuTTY 的 .ppk 未转换）、私钥内容不完整或被改动'
keywords = [
    '解析密钥失败',
    '这把私钥有口令',
]

[[categories]]
name = '账号过期'
# 目标机账号已过有效期，认证阶段就被拒绝
tip = '账号到了有效期、被管理员锁定或停用'
keywords = [
    'Your account has expired',
]

[[categories]]
name = '密码过期'
# 密码必须马上修改的提示（工具没有终端、改不了，所以连接会被拒绝）。
# 同一件事在目标机不同阶段会给两种提示，第一组和第二组各写一份。
tip = '密码已到期，目标机要求先改密码才允许登录——而工具没有交互终端，改不了'
keywords = [
    'You are required to change your password immediately',
]

[[categories]]
name = '连接被断开'
# 认证阶段被对端断开，且对方没有说明原因：客户端拿到的只是一个 EOF。
# 这一类的共同点是"连上了、但被服务端在认证阶段直接掐断"，原因不下发，
# 所以提示词列出可能的情况，供顺着方向查。
tip = '账号状态（过期/被锁/密码需改）、目标机禁止登录（AllowUsers、/etc/nologin）、服务端限流（MaxStartups、LoginGraceTime）、链路被掐断、sshd 重启'
keywords = [
    'ssh: handshake failed: EOF',
]

[[categories]]
name = '连接超时'
# 连接迟迟没有响应
tip = '目标机没开机或防火墙丢包、IP 或端口写错、目标机负载过高没及时响应、中间设备拦截'
keywords = [
    'i/o timeout',
]

[[categories]]
name = '资源耗尽'
# 本机打开的文件太多（并发太高时可能出现）
tip = '本机打开的文件句柄用完了（并发偏高时容易撞上）、本机 ulimit 偏小'
keywords = [
    'too many open files',
]

[[categories]]
name = '执行超时'
# 命令跑太久，超过配置里的执行超时
tip = '命令本身耗时超过配置的超时、命令卡在等输入、目标机负载过高跑不完'
keywords = [
    '命令执行超时',
]

[[categories]]
name = '任务已取消'
# 执行过程中被中断（Ctrl+C）
tip = '执行过程中被 Ctrl+C，或被上层任务中断'
keywords = [
    'context canceled',
]

[[categories]]
name = '连接中断'
# 执行途中连接被断开：目标机重启、网络抖动、对端主动断开
tip = '目标机重启、网络抖动、中间设备超时'
keywords = [
    'connection lost',
    'ssh: disconnect, reason',
    'use of closed network connection',
    'broken pipe',
]

[[categories]]
name = '拒绝网络连接'
# 目标机端口没开，或者被防火墙/安全组拒绝、重置
tip = '端口没开、sshd 没起、防火墙或安全组拒绝、端口写错（如把 22 写成 2222）'
keywords = [
    'connection refused',
    'connection reset',
    'actively refused it',
]

[[categories]]
name = '身份验证失败'
# 用户名或密码/密钥不对，目标机不接受
tip = '密码错、私钥不被认、认证方式不被接受'
keywords = [
    'unable to authenticate',
    'permission denied (publickey',
    'permission denied (password',
    'permission denied (keyboard',
]

[[categories]]
name = '命令被拒绝'
# 目标机接受了连接，但拒绝执行命令
tip = '账号只许传文件、只许交互登录、shell 不可用'
keywords = [
    'ssh: command * failed',
    'ssh: could not start shell',
]

[[categories]]
name = '无法建立会话'
# 连上了，但目标机不给开会话（常见于并发会话数被限制）
tip = '并发会话数限制、服务端资源不足'
keywords = [
    '创建会话失败',
    '创建输入通道失败',
]

[[categories]]
name = '会话被中断'
# 命令执行到一半会话断了，拿不到退出码
tip = '命令可能已执行；目标机重启/网络中断/sshd 断开'
keywords = [
    'remote command exited without exit status',
]

[[categories]]
name = '权限不足'
# 登录用户没有操作权限（读写文件、执行命令等）。
# 必须排在「身份验证失败」之后——上面那类已经把"认证被拒"的情形先认掉了
tip = '登录用户对目标路径没有读写权限、命令需要 root 而当前是登录用户、目标文件属主是别人'
keywords = [
    'permission denied',
]

[[categories]]
name = 'DNS解析失败'
# 主机名解析不出来（清单里填了域名、或目标机需要反查域名时）
tip = '清单里写的是域名而解析不了、本机 DNS 配置有问题、域名拼错'
keywords = [
    'no such host',
]

[[categories]]
name = 'SSH协议错误'
# 对端不是 SSH 服务，或 SSH 版本谈不拢（如误连到 web 端口）
tip = '端口连到了非 SSH 服务（如 web、数据库）、sshd 版本过旧不兼容、中间有设备改写了流量'
keywords = [
    'unsupported protocol',
    'junk character in version line',
    'protocol mismatch',
]

[[categories]]
name = '远程路径不存在'
# 上传的远程目标目录、下载的远程路径，在目标机上没有
tip = '写的远程路径在目标机上没有、路径拼错、大小写不符'
keywords = [
    '远程路径不存在',
]

[[categories]]
name = '远端没有文件'
# 下载模式：路径下没有可下载的文件（空目录，或全是软链接被过滤掉）
tip = '目录为空，或全是符号链接已被过滤'
keywords = [
    '远程路径中没有可下载的文件',
    '没有可下载的文件',
]

[[categories]]
name = '远程文件已存在'
# 目标机上已经存在同名文件
tip = '目标机上已有同名文件、上次执行留下的残留'
keywords = [
    '文件已存在',
    'file already exists',
]

[[categories]]
name = 'SFTP失败'
# 传输环节失败：建连接、建目录、开/写文件出了错
tip = 'sftp 子系统被禁、远端目录权限/磁盘、账号受限、传输中断'
keywords = [
    '创建远程文件失败',
    '写入远程文件失败',
    '写入临时文件失败',
    '创建临时目录失败',
    '创建临时文件失败',
    '创建远程目录失败',
    '打开远程文件失败',
    'SFTP 客户端创建失败',
]

[[categories]]
name = 'sudo失败'
# -m sudo 时，把文件搬到目标位置这一步失败
tip = '登录用户不在 sudoers 里、sudo 需要密码而这个是给不了的、目标机限制了 sudo'
keywords = [
    'sudo mv 失败',
]

[[categories]]
name = '本地文件错误'
# 本机这边的文件问题：不存在、读不了、写不了
tip = '本机路径不存在、权限不足、磁盘满、文件被别的程序占用'
keywords = [
    '打开本地文件失败',
    '创建本地文件失败',
    '写入本地文件失败',
    '文件不可读',
]


# ===== 第二组：连上了，但命令被目标机拒绝执行 =====
#
# 这一类里，命令根本没跑，那个非 0 的退出码是拒绝方给的。命中下面任一条，
# 分类就按原因显示（如「密码过期」），退出码照旧保留在明细里。

[[exit_code_categories]]
name = '密码过期'
# 密码到期，目标机不允许执行命令时打印的提示
tip = '密码已到期，目标机要求先改密码才允许执行命令'
keywords = [
    'Password change required but no TTY available',
    'WARNING: Your password has expired.',
]

[[exit_code_categories]]
name = '登录被禁止'
# 目标机把该账号的登录 shell 设成了 nologin（禁止登录）时打印的提示。
# 中文、英文都留着——提示语言跟随目标机的系统语言
tip = '目标机把该账号的登录 shell 设成了 nologin、账号被管理员停用'
keywords = [
    '此帐户目前不可用。',
    'This account is currently not available.',
]

[[exit_code_categories]]
name = '仅允许 SFTP'
# 目标机限制该账号只能传文件、不能执行命令时打印的提示
tip = '目标机限制该账号只能传文件、不能执行命令（常见于备份或中转账号）'
keywords = [
    'This service allows sftp connections only.',
]
