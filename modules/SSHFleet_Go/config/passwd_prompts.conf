# 批量改密（--change-password）的提示词表：认出远端在问什么，就喂对应的值。
#
# 所有字段必须保留；缺字段或取值非法，启动即报错。
#
# 值不在本文件里配：当前密码取清单里那台机器的登录密码，新密码取 --change-password 的参数。
# 入场信号也不在本文件里配：取 error_keywords.conf 里「密码过期」分类的关键词——
# 没出现这个信号就当这台机器没过期，全程不喂。
# 匹配口径（正则 / 大小写）随 SSHFleet.conf 的 [interactive] 段。

# 一份提示一条；顺序即提问顺序。远端重问就再喂一次，喂满即止。
[[step]]
# 提示原文：从远端打印的提示里原样抄一段就够
keywords = ['当前的密码', 'Current password', '(current) UNIX password']
# value 只能是这两个之一：current = 清单里的登录密码，new = --change-password 的新密码
value = 'current'
# 最多喂几次
max = 1

[[step]]
keywords = ['新的密码', 'New password']
value = 'new'
# 弱密码会被 PAM 拒并重问，留几次余量
max = 4

[[step]]
keywords = ['重新输入', 'Retype']
value = 'new'
max = 4
