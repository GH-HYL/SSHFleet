# 批量改密（--change-password）专用配置：改密要认的两类文字都在这里。
#
#   [[step]]      提示词表——认出面端在问什么，就喂对应的值
#   [[category]]  失败分类——改密失败时，按远端自己说的那句原话归类
#
# 值不在本文件里配：当前密码取清单里那台机器的登录密码，新密码取 --change-password 的参数。
# 入场信号也不在这里配：取 error_keywords.conf 里「密码过期」分类的关键词——
# 没出现这个信号就当这台机器没过期，全程不喂。
# 匹配口径（正则 / 大小写）随 SSHFleet.conf 的 [interactive] 段。
#
# 字段缺一或取值非法，启动即报错。


# ===== 一、提示词表 =====
#
# 一份提示一条；顺序即提问顺序。远端重问就再喂一次，喂满即止。

[[step]]
# 提示原文：从远端打印的提示里原样抄一段就够
keywords = ['当前的密码', 'Current password', '(current) UNIX password']
# value 只能写两个之一：current = 清单里的登录密码，new = --change-password 的新密码
value = 'current'
# 最多喂几次
max = 1

[[step]]
keywords = ['新的密码', 'New password']
value = 'new'
# 弱密码会被 PAM 拒并重问，留几次余量
max = 4

[[step]]
keywords = ['重新输入', 'Retype']
value = 'new'
max = 4


# ===== 二、失败分类 =====
#
# 这几张表整体排在 error_keywords.conf 之前——改密的机器本来就带着「密码过期」那句提示，
# 排在它后面会被抢走分类。表内顺序按「先根因、后结论」：passwd 会把两者分两句说，
# 实测写不进 /etc/shadow 时给的是「认证令牌操作错误」＋「密码未更改」。

[[category]]
name = '写不进密码文件'
# passwd / PAM 的收敛句。磁盘满、根分区只读、账号被锁定都可能报这一句，它本身分不出是哪种
tip = '目标机写不进 /etc/shadow：磁盘满、根分区只读、账号被锁定都可能报这一句；到目标机上查 df -h 与 /etc/shadow 的属性'
keywords = [
    'Authentication token manipulation error',
    '认证令牌操作错误',
]

[[category]]
name = '密码文件被锁定'
# shadow-utils 自己的并发锁：另一个进程正占着 /etc/shadow。
# 注：多数发行版在这里是**静默等待**而不是报错（2026-09-29 实测：passwd 既不报错也不退出，
# 一路等到 -t），那种情况会落在下面的「改密未完成」
tip = '目标机上同时有另一个改密进程（人工操作、其它工具、定时任务），错峰再跑'
keywords = [
    'cannot lock',
    '无法锁定',
    'token lock busy',
    'try again later',
    '请稍后再试',
]

[[category]]
name = 'PAM 配置出错'
# 目标机 /etc/pam.d/ 的 password 栈有问题：模块缺失、路径写错、加载失败
tip = '目标机的 PAM 配置有问题：password 栈里的模块缺失或加载失败'
keywords = [
    'pam_chauthtok',
    'pam_start',
    'Module is unknown',
    '模块未知',
]

[[category]]
name = 'SELinux 拦截'
tip = '目标机开了 SELinux，且不允许改这个账号的密码'
keywords = [
    'SELinux',
]

[[category]]
name = '旧密码不对'
# pam_unix 的 PAM_AUTH_ERR：清单里给的那台机器的登录密码，目标机不认
tip = '清单里写的那台机器的密码不对了——改密要先过旧密码这一关'
keywords = [
    'Authentication failure',
    '验证失败',
]

[[category]]
name = '改密太频繁'
# pam_unix 的 mindays：距上次改密没到最短天数（/etc/shadow 第 4 列）
tip = '目标机要求两次改密之间隔够天数，现在还没到'
keywords = [
    'You must wait longer',
    '等待更长时间',
]

[[category]]
name = '账号不允许改密'
tip = '账号被锁定或密码已失效，目标机不允许它自己改密码'
keywords = [
    'passwordless account',
    '没有密码的账户',
    'You may not view or modify',
    '不能查看或更改',
]

[[category]]
name = '改密没有权限'
# 关键词都带句点：不带的话会把「Permission denied (publickey)」这类认证失败也吃掉
tip = '登录账号改不了这个账号的密码（改别人的密码要 root）'
keywords = [
    'Permission denied.',
    '没有权限。',
]

[[category]]
name = '新密码不合规'
# pam_pwquality 的 BAD PASSWORD、pam_unix 的 obscure（与旧密码太像）、两次输入不一致。
# 中文来自目标机的 shadow.mo，英文来自 libpwquality——两种都留着。
# 排在根因型分类之后：它也出现在「写不进」的收尾句里，让根因先认
tip = '目标机的密码规则拒了新密码：太短、太简单、与旧密码太像、在字典里，或两次输入不一致'
keywords = [
    'BAD PASSWORD',
    '密码未被更改',
    '密码未被改变',
    '密码未更改',
    '密码没有更改',
    '没有更改',
    'is unchanged',
    'password unchanged',
    '脆弱的密码',
    'weak password',
    '并不匹配',
    "don't match",
    'too short',
    'too similar',
    'dictionary',
    '太短',
    '太简单',
    '基于字典',
    '过于简单',
]

[[category]]
name = '改密未完成'
# 兜底桶，不是一类原因：落在这一条说明具体原因没认出来。
# 工具那三句兜底文案共用「改密没有完成」这个前缀
tip = '没认出远端给的原因：它的提示措辞不在提示词表里、只反复重问、或收下密码后一直不回应（多半卡在读写密码文件上）'
keywords = [
    '改密没有完成',
]

[[category]]
name = '密码未过期'
# 工具自己写进 error 的固定文案，不是远端输出：整场没出现过期信号，这台机器不需要改密
tip = '这台机器的密码没过期，没有需要改的'
keywords = [
    '密码未过期，跳过改密',
]
