# ============================================================
# 错误分类关键词映射（TOML 版；分类顺序与关键词自旧 YAML 一字未改，spec D11）
# ------------------------------------------------------------
# 匹配顺序：自上而下遍历，取第一个命中的分类。因此"泛词"分类（如 permission denied）
# 要排在"强特征"分类之后，否则会抢先命中，把具体原因盖掉。
#
# 通配符只有星号 *，含义是"任意长度的内容（可以为空）"：
# 按片段顺序出现即可命中，不要求从头开始、到尾结束，片段之间也不要求相邻。
# * 之外的符号（. ? [] ^ $ \d 等）一律按普通字符处理。
# 不带 * 的关键词就是普通子串包含匹配（大小写不敏感）。
#
# 关键词用 TOML 字面字符串（单引号）书写，避免 \ 与 : 的转义歧义。
# ============================================================


