# ============================================================
# 错误分类规则（可自由修改）
# ------------------------------------------------------------
# 这个文件决定：每个执行失败的节点，在结果里显示什么「分类」。
#
# 例：目标机的密码过期时，报错里会出现 "Password change required but no TTY available"，
#     命中下面第二组的关键词，分类就显示「密码过期」——而不是笼统的「执行失败(退出码1)」。
#
# 【怎么改】
#   调分类效果：在对应分类的 keywords 里增删关键词，存盘后重新运行即可，不用改程序。
#   加新分类  ：复制一组 [[categories]]，改名、关键词、tip，位置按上面第 2 条规则放。
#   停用分类  ：整组删掉即可（该分类从结果里消失，它会退回显示报错原文）。
#   加提示    ：每个分类都有一行 tip，写的是"这个分类可能包括哪些情况"：
#                 tip = '账号过期/被锁、禁止登录、并发限流、链路中断'
#               本次真出现了该分类、且 tip 有内容时，统计末尾会跟着显示这一句；
#               写空串 tip = '' 就不显示——还没想好的先留空，不影响使用。
#               （「执行失败(退出码N)」那条由工具按退出码自动给，不用在这里写）
#
#   一组是这样写的：
#     [[categories]]
#     name = '分类名'                        ← 结果显示的分类名，自己能看懂就行
#     tip = '可能包括哪些情况'                ← 统计末尾的提示，写空串 tip = '' 则不显示
#     keywords = [ '关键词1', '关键词2' ]     ← 写几条就按几条认；不写就永远匹配不上
#
# 【匹配规则】
#   1. 不区分大小写；报错内容里出现这个关键词就算命中，不必整句一字不差
#   2. 从上往下试，先命中的分类胜出 → 具体的原因写在前面，笼统的写在后面
#   3. 中间会变化的部分用 * 代替，例：'ssh: command * failed'
#   4. 关键词越长越准。写得太短会把别的报错也认成它
#      （例：只写 'expired' 会把证书过期、登录会话过期一起认成密码过期）
#
# 【两组规则的区别：按"目的命令有没有给出退出码"分】
#   第一组 [[categories]]            没有目的命令的退出码时用：连不上、超时、认证失败、
#                                    传输失败、预检失败、改密……
#   第二组 [[exit_code_categories]]  目的命令自己以非 0 收场时用：会话被拒（如密码过期）、
#                                    命令自身失败。这里命中的分类会顶掉
#                                    「执行失败(退出码N)」，退出码本身照旧保留。
#
# 【工具自己报的原因：报文】
#   工具自己对失败原因的陈述也是一行文本，格式统一：
#       sshfleet.<环境>.<环节>: <英文描述>
#
#   例：sshfleet.transfer.finished: 6 of 10 files transferred
#
#   它和远端说的话走同一套匹配，直接写进 keywords 当关键词即可。
#   环境固定七种，一条前缀就能认领一整摊：
#     connect  建连与认证    session  会话与终端    run  命令执行    transfer  文件传输
#     passwd   批量改密      answer   代填          abort  中断与取消
#
#   一条分类里可以同时挂远端原话与工具报文，两者没有优先级差别，只看在文件里的先后。
#   报文原文就是终端与归档里看到的原文，不翻译——给人看的中文只有这里的 name 与 tip。
#
#   「密码过期」是个例外，它没有报文：密码过期是远端说的话（那几行改密向导），工具只是
#   把它读了回来，所以它照旧只挂远端关键词。
#
#   一条分类只要写了 name 就合法。没有 keywords 的分类永远匹配不上，它的结果会落到
#   "未归类"里显示报错原文——由你自己负责。
#
# 【怎么确认改对了】
#   跑一次，看结果明细里的「分类」；不对就回来改这里。
# ============================================================


# ===== 第一组：命令没能正常执行 =====

[[categories]]
name = '部分成功'
# 传输时有的文件成了、有的没成。
# 工具在传完之后陈述一句事实：sshfleet.transfer.finished: 6 of 10 files transferred。
# 这里认的就是它——叫不叫「部分成功」由本条的 name 说了算，报文本身只陈述成了几个。
# 删掉本条，这类结果就回落成显示那行报文原文。
#
# 它必须排在最前面：这一格里同时躺着「最后一条逐文件失败原因」，若让后面那些分类先试，
# 权限不足 之类的词会把整批的结论抢走（此前靠程序一级定性先判，报文时代只能靠次序）。
tip = '一部分文件传成了、一部分没成——看明细里每台的失败原因，多数是同一种'
keywords = [
    'sshfleet.transfer.finished',
]

[[categories]]
name = '网络不可达'
# 网络层面就到不了目标机
tip = '目标机没开机、IP 写错、不在同一网段、路由或防火墙把 ICMP 挡了'
keywords = [
    'no route to host',
    'network is unreachable',
    'host is unreachable',
]

[[categories]]
name = '握手超时'
# 连上了但握手谈不拢，超过了配置里的连接超时
tip = '目标机负载过高、sshd 在认证前被限流（MaxStartups）、链路质量差、中间设备限速'
keywords = [
    'sshfleet.connect.handshake_timeout',
]

[[categories]]
name = '密钥不匹配'
# 只在「没配密码、只用密钥、密钥被拒」时命中；配了密码的会落到下面的「身份验证失败」，
# 这样才不会把「密码也被拒」这个事实盖掉
tip = '目标机上没有这把公钥、authorized_keys 没加或加到了别的机器、私钥与目标机上的公钥不是一对'
keywords = [
    '[none publickey]',
]

[[categories]]
name = '密钥解析失败'
# 私钥本身有问题：格式不对、口令不对、文件内容不是私钥
tip = '私钥有口令但没给口令、格式不对（如 PuTTY 的 .ppk 未转换）、私钥内容不完整或被改动'
keywords = [
    'sshfleet.connect.key_parse_failed',
    'sshfleet.connect.key_passphrase_missing',
]

[[categories]]
name = '账号过期'
# 目标机账号已过有效期，认证阶段就被拒绝。
# 这句提示由 PAM 发出（不是 sshd），PAM 会按目标机的语言翻译：
#   · RHEL 系 / openEuler 的 pam 包带中文译文，中文环境下是「您的帐户已过期；……」
#   · Ubuntu / Debian 的 pam 包不带中文译文，任何语言环境下都是英文
# 所以中英两套都要留。中文一条照发行版里的译文原文写，别改字（是「帐户」不是「账户」）。
tip = '账号到了有效期、被管理员锁定或停用'
keywords = [
    'Your account has expired',
    '您的帐户已过期',
]

# 批量改密的失败分类在 config/keywords_passwd.conf 里（跑 --change-password 时看那份）。

[[categories]]
name = '密码过期'
# 密码必须马上修改的提示（工具没有终端、改不了，所以连接会被拒绝）。
# 同一件事在目标机不同阶段会给两种提示，第一组和第二组各写一份。
# 注：这三条同时是 -a 运行的中止词（命中即终止该节点会话，见交互分支实现）
tip = '密码已到期，目标机要求先改密码才允许登录——而工具没有交互终端，改不了'
keywords = [
    'You are required to change your password immediately',
    'WARNING: Your password has expired.',
    'You must change your password now and log in again!',
]

[[categories]]
name = '连接被断开'
# 认证阶段被对端断开，且对方没有说明原因：客户端拿到的只是一个 EOF。
# 这一类的共同点是"连上了、但被服务端在认证阶段直接掐断"，原因不下发，
# 所以提示词列出可能的情况，供顺着方向查。
tip = '账号状态（过期/被锁/密码需改）、目标机禁止登录（AllowUsers、/etc/nologin）、服务端限流（MaxStartups、LoginGraceTime）、链路被掐断、sshd 重启'
keywords = [
    'ssh: handshake failed: EOF',
]

[[categories]]
name = '连接超时'
# 连接迟迟没有响应
tip = '目标机没开机或防火墙丢包、IP 或端口写错、目标机负载过高没及时响应、中间设备拦截'
keywords = [
    'i/o timeout',
]

[[categories]]
name = '资源耗尽'
# 本机打开的文件太多（并发太高时可能出现）
tip = '本机打开的文件句柄用完了（并发偏高时容易撞上）、本机 ulimit 偏小'
keywords = [
    'too many open files',
]

[[categories]]
name = '执行超时'
# 命令跑太久，超过配置里的执行超时
tip = '命令本身耗时超过配置的超时、命令卡在等输入、目标机负载过高跑不完'
keywords = [
    'sshfleet.run.timeout',
]

[[categories]]
name = '建连被取消'
# 还在建立连接时被中断（Ctrl+C）：这台机器**没有被执行到**。
# 正常情况下这一条由工具直接判定"中断时中断在哪一步"，不靠下面的关键词；关键词是兜底——
# 万一哪条路径没走到那步判定，光看报错文案也能把它归到这里，而不是漏成"报错原文"。
tip = '按 Ctrl+C 时这台机器还在建立连接（连接慢、或排在连接超时里慢慢熬的最容易撞上）——本次没有执行到它'
keywords = [
    'sshfleet.abort.connect_canceled',
    'operation was canceled',
]

[[categories]]
name = '任务已取消'
# 已经连上、跑在命令 / 传输 / 改密中途时被中断（Ctrl+C）。
# 与上面「建连被取消」的区别就是"中断在哪一步"：那台连都没连上，这台是真跑过一段。
tip = '执行过程中被 Ctrl+C，或被上层任务中断——这台机器已经连上、并跑过一段'
keywords = [
    'sshfleet.abort.canceled',
    'context canceled',
]

[[categories]]
name = '连接中断'
# 执行途中连接被断开：目标机重启、网络抖动、对端主动断开
tip = '目标机重启、网络抖动、中间设备超时'
keywords = [
    'connection lost',
    'ssh: disconnect, reason',
    'use of closed network connection',
    'broken pipe',
]

[[categories]]
name = '拒绝网络连接'
# 目标机端口没开，或者被防火墙/安全组拒绝、重置
tip = '端口没开、sshd 没起、防火墙或安全组拒绝、端口写错（如把 22 写成 2222）'
keywords = [
    'sshfleet.connect.refused',
    'connection refused',
    'connection reset',
    'actively refused it',
]

[[categories]]
name = '身份验证失败'
# 用户名或密码/密钥不对，目标机不接受
tip = '密码错、私钥不被认、认证方式不被接受'
keywords = [
    'unable to authenticate',
    'permission denied (publickey',
    'permission denied (password',
    'permission denied (keyboard',
]

[[categories]]
name = '命令被拒绝'
# 目标机接受了连接，但拒绝执行命令
tip = '账号只许传文件、只许交互登录、shell 不可用'
keywords = [
    'ssh: command * failed',
]

[[categories]]
name = '终端分配失败'
# 目标机明确拒绝了分配终端（PTY）的请求——工具在做代填（-a）与改密时才申请终端，
# 这两种模式撞上它就是这个原因。与「命令被拒绝」同层：连上了、会话也开着，
# 但目标机不认这个请求。
tip = '目标机不允许分配终端：sshd 关了 PermitTTY、MaxSessions 已满、PAM 拒绝'
keywords = [
    'ssh: pty-req failed',
]

[[categories]]
name = '无法建立会话'
# 连上了，但目标机不给开会话（常见于并发会话数被限制）
tip = '并发会话数限制、服务端资源不足'
keywords = [
    'sshfleet.session.create_failed',
    'sshfleet.session.channel_failed',
    'sshfleet.session.pty_failed',
]

[[categories]]
name = '会话被中断'
# 命令执行到一半会话断了，拿不到退出码
tip = '命令可能已执行；目标机重启/网络中断/sshd 断开'
keywords = [
    'sshfleet.session.exit_missing',
    'remote command exited without exit status',
]

[[categories]]
name = '权限不足'
# 登录用户没有操作权限（读写文件、执行命令等）。
# 必须排在「身份验证失败」之后——上面那类已经把"认证被拒"的情形先认掉了
tip = '登录用户对目标路径没有读写权限、命令需要 root 而当前是登录用户、目标文件属主是别人'
keywords = [
    'permission denied',
]

[[categories]]
name = 'DNS解析失败'
# 主机名解析不出来（清单里填了域名、或目标机需要反查域名时）
tip = '清单里写的是域名而解析不了、本机 DNS 配置有问题、域名拼错'
keywords = [
    'no such host',
]

[[categories]]
name = 'SSH协议错误'
# 对端不是 SSH 服务，或 SSH 版本谈不拢（如误连到 web 端口）
tip = '端口连到了非 SSH 服务（如 web、数据库）、sshd 版本过旧不兼容、中间有设备改写了流量'
keywords = [
    'unsupported protocol',
    'junk character in version line',
    'protocol mismatch',
    # 算法谈不拢：对端只支持本工具已弃用的老算法（老 sshd 常见）。
    # 这一条要写在冒号前，后面跟的是哪一类算法（密钥交换 / 加密 / MAC / 主机密钥）
    'ssh: no common algorithm',
]

[[categories]]
name = '远程路径不存在'
# 上传的远程目标目录、下载的远程路径，在目标机上没有
tip = '写的远程路径在目标机上没有、路径拼错、大小写不符'
keywords = [
    'sshfleet.transfer.remote_missing',
    'sshfleet.transfer.remote_unreachable',
]

[[categories]]
name = '远端没有文件'
# 下载模式：路径下没有可下载的文件（空目录，或全是软链接被过滤掉）
tip = '目录为空，或全是符号链接已被过滤'
keywords = [
    'sshfleet.transfer.no_files',
    'sshfleet.transfer.list_failed',
]

[[categories]]
name = '远程文件已存在'
# 目标机上已经存在同名文件
tip = '目标机上已有同名文件、上次执行留下的残留'
keywords = [
    'file already exists',
    'sshfleet.transfer.remote_exists',
]

[[categories]]
name = 'SFTP失败'
# 传输环节失败：建连接、建目录、开/写文件出了错
tip = 'sftp 子系统被禁、远端目录权限/磁盘、账号受限、传输中断'
keywords = [
    'sshfleet.transfer.client_failed',
    'sshfleet.transfer.remote_file_failed',
    'sshfleet.transfer.local_file_failed',
    'sshfleet.transfer.tmp_failed',
    'sshfleet.transfer.remote_not_dir',
]

[[categories]]
name = 'sudo失败'
# -m sudo 时，把文件搬到目标位置这一步失败
tip = '登录用户不在 sudoers 里、sudo 需要密码而这个是给不了的、目标机限制了 sudo'
keywords = [
    'sshfleet.transfer.sudo_failed',
]

[[categories]]
name = '本地文件错误'
# 本机这边的文件问题：不存在、读不了、写不了
tip = '本机路径不存在、权限不足、磁盘满、文件被别的程序占用'
keywords = [
    'sshfleet.transfer.local_unreadable',
    'sshfleet.transfer.local_dir_failed',
]

[[categories]]
name = '代填用尽后超时'
# 只在 -a 运行时可能出现：代填全部送出之后，脚本再无输出直到执行超时。
# 必须排在「执行超时」与「触发词未命中」前面——「全送出去了」这个结论比"有没送出去的"
# 更具体，谁在前面谁胜出。
tip = '脚本可能卡在一个没配触发词的提示上，也可能任务本身耗时长——工具分不出'
keywords = [
    'sshfleet.answer.exhausted_timeout',
]

[[categories]]
name = '触发词未命中'
# 只在 -a 运行时可能出现：执行结束时仍有代填没被送出（正常结束与超时都算）。
# 纯兜底，故排在最后——具体原因由中止词在第 0 秒归因（如密码过期）
tip = '脚本的提问没认出来（触发词措辞不同），或脚本自己判断完根本没问'
keywords = [
    'sshfleet.answer.missed',
    'sshfleet.answer.exhausted_timeout',
]

# ===== 第二组：连上了，但命令被目标机拒绝执行 =====
#
# 这一类里，命令根本没跑，那个非 0 的退出码是拒绝方给的。命中下面任一条，
# 分类就按原因显示（如「密码过期」），退出码照旧保留在明细里。

[[exit_code_categories]]
name = '密码过期'
# 密码到期，目标机不允许执行命令时打印的提示
tip = '密码已到期，目标机要求先改密码才允许执行命令'
keywords = [
    'Password change required but no TTY available',
    'WARNING: Your password has expired.',
]

[[exit_code_categories]]
name = '登录被禁止'
# 目标机把该账号的登录 shell 设成了 nologin（禁止登录）时打印的提示。
# 中文、英文都留着——提示语言跟随目标机的系统语言
tip = '目标机把该账号的登录 shell 设成了 nologin、账号被管理员停用'
keywords = [
    '此帐户目前不可用。',
    'This account is currently not available.',
]

[[exit_code_categories]]
name = '仅允许 SFTP'
# 目标机限制该账号只能传文件、不能执行命令时打印的提示
tip = '目标机限制该账号只能传文件、不能执行命令（常见于备份或中转账号）'
keywords = [
    'This service allows sftp connections only.',
]
