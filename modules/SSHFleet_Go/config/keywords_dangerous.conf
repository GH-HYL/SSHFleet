# ============================================================
# 危险命令检测规则（可自由修改）
# ------------------------------------------------------------
#
# ⚠️ 规则内容尚未完成（2026-10-19）：本文件的字段形态、加载校验已按新口径落定
#    （regex 是数组、新增 reason），但 17 条规则的判定内容还在逐个调整中，
#    「递归删除系统目录」「递归删除」等几条存在误报/漏报，见工单 04–08。
#    在此之前不要拿它当发布版。
#
# 作用：命令下发给目标机之前，先在这里比一遍。命中的规则会提示风险等级，
#       提醒你确认要不要真的执行——它是操作助手，不是拦截恶意命令的防线。
#       它认的是命令原文：不论命令写在 bash、python、perl、node、php 里，一律按文本匹配。
#
# 【怎么改】
#   每条规则六项，存盘后重新运行即可，不用改程序：
#     name        规则名，提示里会显示
#     example     一条会触发它的示例命令，提示里会显示
#     reason      为什么拦这句话，提示里会显示
#     regex       匹配用的正则，可以写一条，也可以写多条（写成数组）
#     risk_level  风险等级，见下
#     enabled     true 启用；改成 false 即停用该条（停用的规则只要求 name，其余可以不写）
#   加规则：复制一整段 [[rules]]，按上面六项改内容
#
# 【写正则注意三点】
#   1. 在命令原文的任意位置匹配上就算命中，不必限定开头
#   2. 旗标写法由规则自己列全：写成 -rf、-fr、--recursive --force 都要各写一条正则
#      （工具不做归一化，也不会替你补）
#   3. 一个汉字算显示两列；example 与 reason 超过 30 个显示列会加载失败
#
# 【风险等级怎么选】
#   forbidden            最强提醒：打印警告后直接退出，不执行
#   high / medium / low  按危险程度提示，颜色和措辞不同，都要你再确认一次
# ============================================================


[[rules]]
name        = '递归删除根目录'
example     = 'rm -rf /'
reason      = '根文件系统被删，机器当场不可用'
# 递归 + 强制 + 目标就是根（/、/*、//、/.）。旗标连写与分写各写一条，
# 根前面可以夹 --no-preserve-root 这类参数，也允许被引号包住。
# 目标后面还跟着别的路径（/ /opt/x）也算——删根已经发生了。
# 只认「一段路径以根开头」，/etc/*、/tmp/* 这类别的目录不归这条。
regex       = [
  '\brm\s+(?:[\w.-]+\s+)*?-[a-zA-Z]*(?:[rR][a-zA-Z]*f|f[a-zA-Z]*[rR])[a-zA-Z]*\s+(?:[\w.-]+\s+)*?[\x22\x27]?/[*.]*[\x22\x27]?(?:[\s|;&)]|$)',
  '\brm\s+(?:[\w.-]+\s+)*?(?:-[rR]\s+-f|-f\s+-[rR])\s+(?:[\w.-]+\s+)*?[\x22\x27]?/[*.]*[\x22\x27]?(?:[\s|;&)]|$)',
  '\brm\s+(?:[\w.-]+\s+)*?--recursive\s+(?:[\w.-]+\s+)*?--force\s+(?:[\w.-]+\s+)*?[\x22\x27]?/[*.]*[\x22\x27]?(?:[\s|;&)]|$)',
]
risk_level  = 'forbidden'
enabled     = true

[[rules]]
name        = '递归删除系统目录'
example     = 'rm -rf /etc'
reason      = '系统配置目录被删，整批难恢复'
# 只认「删系统目录本身」与「清空它的全部内容」（/etc、/etc/、/etc/*）。
# 删系统目录里面的某个子目录或文件（/etc/nginx、/var/log/app.log）不算——
# 系统目录名后面紧跟字母数字或斜杠，说明它是更深一层，这条不认。
# /root 不在此列：那是 root 的家目录，日常清理自己的文件很正常。
regex       = [
  '(?:\x22|\x60)?\brm\s+-[a-zA-Z]*(?:[rR][a-zA-Z]*f|f[a-zA-Z]*[rR])[a-zA-Z]*\s+/(?:etc|usr|var|lib|sbin|bin|boot)(?:\s|$|[;&|]|[\x22\x60)]|\))',
  '(?:\x22|\x60)?\brm\s+-[a-zA-Z]*(?:[rR][a-zA-Z]*f|f[a-zA-Z]*[rR])[a-zA-Z]*\s+/(?:etc|usr|var|lib|sbin|bin|boot)(?:/\*|\*)?(?:\s|$|[;&|]|[\x22\x60)]|\))',
  '(?:\x22|\x60)?\brm\s+(?:-[rR]\s+-f|-f\s+-[rR])\s+/(?:etc|usr|var|lib|sbin|bin|boot)(?:\s|$|[;&|]|[\x22\x60)]|\))',
]
risk_level  = 'forbidden'
enabled     = true

[[rules]]
name        = '格式化主盘'
example     = 'mkfs /dev/sda'
reason      = '格式化盘设备，盘上数据整块消失'
regex       = ['\bmkfs(?:\.[a-z0-9]+)?\b[^\n]*/dev/(?:sd|hd|vd|nvme|mmcblk|xvd)']
risk_level  = 'forbidden'
enabled     = true

[[rules]]
name        = '抹盘 dd'
example     = 'dd if=/dev/zero of=/dev/sda'
reason      = '写入盘设备，整盘数据被覆盖'
regex       = ['\bdd\s[^\n]*\bof=/dev/(?:sd|hd|vd|nvme|mmcblk|xvd)']
risk_level  = 'forbidden'
enabled     = true

[[rules]]
name        = '关机停机'
example     = 'shutdown -h now'
reason      = '整批机器同时停电，业务全部中断'
# 撤销（-c）不算关机，带 -r 的是重启（归「系统重启」）。
# 不带参数直接 shutdown 也是关机（默认进单用户后停）。
regex       = [
  '\bshutdown\s*$',
  '\bshutdown\s+(?:-h|--poweroff|-P)\b(?:[^rR-]|-[^cC])*$',
  '\b(?:poweroff|halt)\s*$',
  '\b(?:init|telinit)\s+0\b',
]
risk_level  = 'forbidden'
enabled     = true

[[rules]]
name        = '杀死所有进程'
example     = 'kill -9 -1'
reason      = '杀掉本机全部进程，系统随之失联'
regex       = ['\bkill\s+(?:-9|-KILL|\S+)\s+-1\b']
risk_level  = 'forbidden'
enabled     = true

[[rules]]
name        = '系统重启'
example     = 'reboot'
reason      = '整批同时重启，业务会中断一阵'
regex       = [
  '\breboot\b',
  '\bshutdown\s[^\n]*?-r\b',
  '\b(?:init|telinit)\s+6\b',
]
risk_level  = 'high'
enabled     = true

[[rules]]
name        = '递归删除'
example     = 'rm -rf /opt/app'
reason      = '递归强制删除，删掉就找不回来了'
# 旗标写法各写一条：合并旗标（-rf / -fr / -Rf）、分写（-r -f）、长写法。
regex       = [
  '\brm\s+-[a-zA-Z]*(?:[rR][a-zA-Z]*f|f[a-zA-Z]*[rR])[a-zA-Z]*\s+/(?:etc|tmp)\b(?:[^a-z0-9/]|$)',
  '\brm\s+-[a-zA-Z]*(?:[rR][a-zA-Z]*f|f[a-zA-Z]*[rR])[a-zA-Z]*\s+/(?:etc|tmp)(?:/\*)?(?:\s|$|[;&|)]|[\x22\x60)])',
  '\brm\s+-[a-zA-Z]*(?:[rR][a-zA-Z]*f|f[a-zA-Z]*[rR])[a-zA-Z]*\s+(?:\S+\s+)+/[^\s]+',
  '\brm\s+(?:-[rR]\s+-f|-f\s+-[rR])\s+\S',
  '\brm\s+(?:-[a-zA-Z]+\s+)*--recursive\b[^\n]*--force\b',
  '\brm\s+(?:-[a-zA-Z]+\s+)*--force\b[^\n]*--recursive\b',
]
risk_level  = 'high'
enabled     = true

[[rules]]
name        = '屏蔽关键服务'
example     = 'systemctl mask sshd'
reason      = '屏蔽后管理通道可能断掉，连不上'
regex       = ['\bsystemctl\s+mask\s+(?:sshd|network|NetworkManager|systemd-networkd)\b']
risk_level  = 'high'
enabled     = true

[[rules]]
name        = '清空防火墙'
example     = 'iptables -F'
reason      = '防火墙被清空，端口暴露到重启前'
regex       = ['\bip6?tables\s+-F\b']
risk_level  = 'high'
enabled     = true

[[rules]]
name        = '强制删包'
example     = 'rpm -e --nodeps nginx'
reason      = '连依赖一起删掉，服务起不来'
regex       = [
  '\brpm\s+-e\s[^\n]*--nodeps\b',
  '\byum\s+remove\s+(?:-y\s+)*\S',
]
risk_level  = 'high'
enabled     = true

[[rules]]
name        = '删除关键路径文件'
example     = 'rm -f /etc/hosts'
reason      = '关键系统文件被删，服务随即出错'
regex       = [
  '\brm\s+-[a-zA-Z]*f[a-zA-Z]*\s+(?:[\w.-]+\s+)*/(?:etc|var/log|boot)/\S',
  '\brm\s+-[a-zA-Z]*[rR][a-zA-Z]*f[a-zA-Z]*\s+(?:[\w.-]+\s+)*/(?:etc|var/log|boot)/\S',
  '\brm\s+-[a-zA-Z]*f[a-zA-Z]*[rR][a-zA-Z]*\s+(?:[\w.-]+\s+)*/(?:etc|var/log|boot)/\S',
]
risk_level  = 'medium'
enabled     = true

[[rules]]
name        = '停止·禁用服务'
example     = 'systemctl stop sshd'
reason      = '停掉管理通道，机器可能失联'
# sshd / network 的 mask 在「屏蔽关键服务」（高），这里管 stop / disable / mask firewalld。
regex       = [
  '\bsystemctl\s+(?:stop|disable)\s+(?:sshd|network|NetworkManager|systemd-networkd)\b',
  '\bsystemctl\s+(?:stop|disable|mask)\s+firewalld\b',
]
risk_level  = 'medium'
enabled     = true

[[rules]]
name        = '删除账户·用户组'
example     = 'userdel testuser'
reason      = '账号被删，对应权限与任务全失效'
regex       = ['\b(?:userdel|groupdel)\b']
risk_level  = 'medium'
enabled     = true

[[rules]]
name        = '权限修改'
example     = 'chmod 777 file.sh'
reason      = '让任何人可写，权限被整体放开'
regex       = [
  '\bchmod\s+(?:-[a-zA-Z]+\s+)*[0-7]?[0-7][0-7]7\b',
  '\bchmod\s+(?:-[a-zA-Z]+\s+)*[ugoa]*[oa]?\+w\b',
  '\bchmod\s+(?:-[a-zA-Z]+\s+)*a\+rwx\b',
]
risk_level  = 'medium'
enabled     = true

[[rules]]
name        = 'SUID·SGID'
example     = 'chmod u+s /usr/bin/x'
reason      = '设了提权位，谁跑都带属主权限'
regex       = [
  '\bchmod\s+(?:-[a-zA-Z]+\s+)*[ugoa]*[ug]?\+[sS]\b',
  '\bchmod\s+(?:-[a-zA-Z]+\s+)*[2467][0-7]{3}\b',
]
risk_level  = 'medium'
enabled     = true

[[rules]]
name        = '清空系统日志'
example     = 'truncate -s 0 /var/log/syslog'
reason      = '日志被清空，事后无法追溯变更'
regex       = [
  '\btruncate\s+-s\s*0\s+/var/log/',
  '(?:^|[;&|)]\s*|:\s+|"\s*)>\s*\S*/var/log/',
]
risk_level  = 'medium'
enabled     = true
