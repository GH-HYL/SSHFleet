# ============================================================
# 错误分类关键词映射
# 格式: 分类名: [关键词1, 关键词2, ...]
# 用法: 在某一行前加 # 即禁用该关键词；在分类名前加 # 即禁用整类
#
# 匹配顺序：自上而下遍历，取第一个命中的分类。
#   因此"泛词"分类（如权限不足的 permission denied、拒绝网络连接的 refused）
#   要排在"强特征"分类之后，否则会抢先命中，把具体原因盖掉。
#
# 通配符（只此一种，别想多了）：
#   唯一支持的通配符是星号 *，含义是"任意长度的内容（可以为空）"。
#   匹配规则是"按片段顺序出现即可"：不要求从头开始、到尾结束，片段之间也不要求相邻。
#     例：'ssh: command * failed' 可命中  ssh: command bash -lc 'xxx' failed
#   * 之外的符号都不是通配符：. ? [] ^ $ \d 等一律按普通字符处理，
#   所以 'ssh.command' 匹配不到 'ssh:command'，写的时候别手滑。
#   不带 * 的关键词就是普通子串包含匹配（大小写不敏感）。
#   注意：带 * 的关键词在 YAML 里必须用单引号包住，否则 * 会被当成锚点语法。
#
# YAML 特殊字符注意（引号）：
#   关键词里出现以下符号时，必须用单引号包住，否则 YAML 会按特殊语法解析，
#   导致关键词变成字典结构或直接解析报错，而不是字符串：
#     - 冒号+空格（": "）：如 ssh: could not start shell 会被当成映射（key: value），
#       必须写成 'ssh: could not start shell'
#     - 以星号 * 开头：如 *failed 会被当成"引用别名"，引用不存在的锚点直接报错
#     - 以 # [ { ! 开头、包含 " #"（行内注释）等结构，同理建议加引号
#   省心原则：关键词里只要出现 : * # ' [ 等符号，就一律用单引号包住；
#   纯字母/空格/数字组成的关键词可以裸写，不需要引号。
# ============================================================

# --- 网络不可达---
网络不可达:
  - no route to host
  - network is unreachable
  - host is unreachable
  - network unreachable
  - 目标主机不可达
  - 无法访问目标主机
  - 无路由到主机

# --- 握手超时---
握手超时:
  - 握手超时

# --- 密钥不匹配---
# 原文形如 "ssh: handshake failed: ssh: unable to authenticate, attempted methods [none publickey], ..."
# 关键词带右括号精确匹配：只有"没配置密码、仅尝试公钥就被拒"时才命中本类；
# 若配置了密码（原文变成 attempted methods [none publickey password]，不含 [none publickey]），
# 自然落回下方的「身份验证失败」，不会掩盖"密码也被拒"的事实。
密钥不匹配:
  - '[none publickey]'

# --- 密钥解析失败---
# Go 侧解析私钥失败（私钥格式错误、口令错误等），报错形如"解析密钥失败 - ..."
密钥解析失败:
  - 解析密钥失败

# --- 密码过期---
密码过期:
  - password expired
  - change your password now
  - has expired
  - 密码过期

# --- 连接超时---
连接超时:
  - 连接超时
  - connect timeout
  - connection timeout
  - authentication timeout
  - i/o timeout

# --- 资源耗尽---
# 连接层资源类错误（本地文件描述符耗尽等），故障/过载节点常见
资源耗尽:
  - too many open files

# --- 执行超时---
执行超时:
  - 命令执行超时

# --- 任务已取消---
# 用户中断（Ctrl+C / 取消）时 Go 返回 context canceled，命令未执行完成
任务已取消:
  - context canceled

# --- 连接中断---
连接中断:
  - connection lost
  - connection closed
  - disconnected
  - broken pipe
  - socket closed
  - 连接中断
  - 连接已断开
  - 管道破裂

# --- 拒绝网络连接---
拒绝网络连接:
  - connection refused
  - connection reset
  - refused
  - connect refused
  - 拒绝连接
  - 连接被拒绝
  - 拒绝网络连接
  - conn refused
  - reset by peer

# --- 身份验证失败---
身份验证失败:
  - authentication failed
  - unable to authenticate
  - password not accepted
  - access denied
  # OpenSSH 认证被拒原文形如 "Permission denied (publickey,password)"，
  # 带认证上下文的括号后缀归本类；不带括号的通用 "permission denied"
  # 是文件系统权限问题，归"权限不足"（本类在前，先命中则先返回）
  - permission denied (publickey
  - permission denied (password
  - permission denied (keyboard
  - 认证失败
  - 密码错误
  - 身份验证失败
  - auth failed

# --- 命令执行请求被拒---
# 连接与认证都已通过，但节点 sshd 在启动 shell 之前就拒绝了 exec 请求，
# 命令完全没有执行（退出码为 None，输出为空）。
# 常见成因：sshd 无法 fork 会话（进程/内存耗尽）、PAM 会话建立失败、账号受限（如 ForceCommand）
# 报错原文会带上整条封装命令，故用 * 通配掉中间的变量部分（通配符语义见文件头部）
命令执行请求被拒:
  - 'ssh: command * failed'
  - 'ssh: could not start shell'

# --- 会话创建失败---
# Go 侧创建 SSH 会话通道失败（如服务端达到 MaxSessions 限制），报错形如"创建会话失败 - ..."
会话创建失败:
  - 创建会话失败

# --- 会话中断未返回退出码---
# 命令已下发，但通道在执行过程中意外关闭，远端没有回退出状态，命令执行情况未知
会话中断未返回退出码:
  - remote command exited without exit status

# --- 权限不足---
# 文件系统层面的读写权限被拒绝
权限不足:
  - permission denied

# --- DNS解析失败---
DNS解析失败:
  - name or service not known
  - cannot resolve hostname
  - dns resolution failed
  - unknown host
  - hostname not found
  - DNS解析错误
  - 域名解析失败
  - 无法解析主机名

