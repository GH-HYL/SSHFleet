# -*- coding: utf-8 -*- 
# SSHFleet 配置文件

# 账号信息
account:
  port: 10022                 # 默认 SSH 端口（CSV 第 2 列留空时用）
  user: "jx_zyc"              # 默认用户名（CSV 第 3 列留空时用）
  secret_dir: "~/.MyPW"       # 凭据目录：密码/私钥/私钥口令文件的相对路径都拼到这里
  password_security: 2        # 密码安全等级，数字越大越安全
                              #   1=明文：文件内容即密码原文，安全性最低
                              #   2=base64：文件内容为密码的base64编码（默认）
                              #   3=加密：文件内容为密文，需 --gen-key 配主密钥后转换
  password: "SSHFleet_pw"     # 默认密码文件路径（内容格式随 password_security 变化，用 --convert-password 转换；无则留空）
  key: ""                     # 默认私钥文件路径（内容为 PEM 私钥原文）
  key_passphrase: ""          # 默认私钥口令文件路径（内容格式同密码文件，随等级变化；无则留空）

# 执行参数
execution:
  mode: "sudo"           # 执行身份：direct=用登录用户身份执行，sudo=用 root 身份执行（默认 sudo）
  timeout_connect: 10    # 连接超时（秒），连接远程主机的超时
  timeout_execute: 60    # 执行超时（秒），执行命令或脚本的超时
  timeout_transfer: 300  # 传输超时（秒），上传或下载文件的超时

# 功能开关
enable:
  output_to_xlsx: true   # 终端输出同时导出 xlsx；false=仅输出到 txt
  results_to_xlsx: true  # 结果固化到 xlsx 文件；false=不输出到本地文件

# 关键词文件路径
paths:
  keywords:
    error_keywords: "./src/config/error_keywords.yaml"          # 错误分类关键词 YAML 文件（支持 # 注释）
    dangerous_keywords: "./src/config/dangerous_keywords.yaml"  # 危险命令正则关键字 YAML 文件（整条规则前加 # 即禁用）

  # 程序路径
  exe:
    batch_tool_windows: "./src/go/SSHFleet_Go.exe"  # Windows 环境的批量执行程序路径
    batch_tool_linux: "./src/go/SSHFleet_Go"        # Linux   环境的批量执行程序路径

  # 日志路径
  logs:
    historys: "historys"       # 存放历史记录文件夹名称
    tool: "SSHFleetTools.log"  # 工具日志文件名
    exec: "SSHFleet_Go.log"    # 执行日志文件名

  # 结果文件路径
  files:
    asset: "assets"               # 历史记录中转存资产文件夹名称（csv文件、脚本、上传文件，都会备份到这里）
    output: "output.txt"          # 终端输出文件名（txt格式）
    output_xlsx: "output.xlsx"    # 终端输出文件名（xlsx格式）
    report: "report.txt"          # 统计报告文件名（txt格式）
    results_xlsx: "results.xlsx"  # 结果固化文件名（xlsx格式）

# 上传文件参数
upload:
  concurrency_thresholds:   # 单位"字节 B"，按文件大小决定并发策略
    small_file: 2097152     # 2MB；小于此值全量并发
    large_file: 20971520    # 20MB；大于此值串行上传
    medium_concurrency: 10  # 介于两者之间时的并发数
